# nginx's add_header does not inherit into a block that declares its own, so
# these are included per-location rather than set once on the server.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# connect-src is the list of hosts the app actually talks to, and it is short
# on purpose:
#
#   eutils.ncbi.nlm.nih.gov  accession fetches and the lazily-loaded genomes
#   api.anthropic.com        the assistant, and only once the user has entered
#                            their own key — the key lives in localStorage, so
#                            this deployment never holds one
#
# rebase.neb.com is absent deliberately: enzyme data is fetched by
# `npm run build:enzymes` at development time and committed as a generated
# module, so the browser never reaches it. platform.claude.com is a link target,
# a navigation rather than a fetch, and likewise stays out.
#
# `npm run check:csp` diffs the source against this list, because a blocked
# fetch is invisible in dev — where no CSP applies — and only shows up in
# production as a request that quietly fails.
#
# script-src and style-src need no 'unsafe-inline': the Vite build emits a
# linked stylesheet and an external module, and the app sets no style
# attributes. img-src allows data: for the gel canvas' Save PNG export.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://eutils.ncbi.nlm.nih.gov https://api.anthropic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
