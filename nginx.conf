server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fly terminates TLS in front of this, so a redirect built from the
    # connection's scheme would send clients back to http.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # Vite fingerprints everything under /assets, so those are safe to pin
    # forever; index.html must not be, or a deploy never reaches a warm client.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # VIRGE is a single page with no router — saved configurations live in
    # localStorage, not in the URL — so the fallback only has to cover a stray
    # path. try_files re-enters the location above, so the shell keeps its own
    # headers however it was reached.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
